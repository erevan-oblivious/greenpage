<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Page</title>
  <style>
    body {
      background-color: #586654;
      margin: 0;
      min-height: 100vh;
      color: white;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #3b4739;
    }
    .logo {
    font-weight: bold;
    font-size: 1.2rem;
    letter-spacing: 1px;  
    }
    .content-container {
      text-align: center;
      padding: 40px;
    }
    ul {
      list-style-position: inside;
      padding: 0;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="header">
  <div class="logo">GreenPage</div>
  <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
  </nav>
</header>
  <main class="content-container">
    <h1>Welcome to the Green Page!</h1>
    <h2>About</h2>
    <p><strong>This page is designed to be simple and calming.</strong></p>
    <ul>
    <li>Relaxing green background</li>
    <li>Minimalistic design</li>
    <li>Easy on the eyes</li>
    </ul>
    <h2>Feel free to explore and relax!</h2>
    <p>Thank you for visiting!</p>
  </main>
  <footer class="content-container">© 2026 GreenPage. All rights reserved.</footer>
</body>
</html>
